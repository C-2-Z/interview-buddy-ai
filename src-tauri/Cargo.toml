[package]
name = "ezmock-interview-buddy"
version = "0.1.0"
description = "AI 面试模拟器 - Windows 桌面端"
authors = ["EZMock Team"]
edition = "2021"

[lib]
name = "ezmock_interview_buddy_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
